# ============================================
# Adminer - Gerenciamento do banco via navegador
# Acesso: http://<IP-DO-PI>:30081
# ============================================
# Sistema  : MySQL
# Servidor : teampass-db
# Usuário  : root (para ter acesso total)
# Senha    : valor de MARIADB_ROOT_PASSWORD
# Banco    : teampass
# ============================================

# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: teampass
  labels:
    app.kubernetes.io/name: adminer
    app.kubernetes.io/component: tooling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
        app.kubernetes.io/name: adminer
        app.kubernetes.io/component: tooling
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: adminer
          image: docker.io/library/adminer:4-standalone
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Pré-preenche o campo "Sistema" com o host do banco
            - name: ADMINER_DEFAULT_SERVER
              value: "teampass-db"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
# Service NodePort — acesso externo via http://<IP-DO-PI>:30081
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: teampass
  labels:
    app.kubernetes.io/name: adminer
    app.kubernetes.io/component: tooling
spec:
  type: NodePort
  selector:
    app: adminer
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      name: http