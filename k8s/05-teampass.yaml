# ============================================
# TeamPass - Application Deployment + Service
# ============================================
# A imagem é construída com: ./scripts/build-push.sh [TAG] [REGISTRY]
# e empurrada para o registry local do k3s (NodePort 30500)
# ============================================

# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teampass
  namespace: teampass
  labels:
    app.kubernetes.io/name: teampass
    app.kubernetes.io/component: app
  annotations:
    # Controle de versão da imagem — atualizado pelo build-push.sh
    deployment.kubernetes.io/image-tag: "v1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teampass
  # Recreate garante que o PVC (RWO) seja liberado antes do novo pod subir
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: teampass
        app.kubernetes.io/name: teampass
        app.kubernetes.io/component: app
    spec:
      # Raspberry Pi 4 (ARM64)
      nodeSelector:
        kubernetes.io/arch: arm64

      # Aguarda o banco estar pronto antes de iniciar
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Aguardando MariaDB em teampass-db:3306..."
              until nc -z teampass-db 3306; do
                echo "  DB ainda não está pronto, aguardando..."
                sleep 3
              done
              echo "✅ MariaDB pronto!"

      containers:
        - name: teampass
          # Imagem buildada pelo scripts/build-push.sh e disponível no registry do k3s
          # Formato: localhost:30500/teampass:<tag>
          # Troque a tag aqui ao fazer upgrade de versão
          image: localhost:30500/teampass:v1
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: teampass-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teampass-db-secret
                  key: db-password
            - name: ADMIN_PWD
              valueFrom:
                secretKeyRef:
                  name: teampass-app-secret
                  key: admin-password

          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: sk
              mountPath: /var/www/html/storage/sk
            - name: files
              mountPath: /var/www/html/storage/files
            - name: upload
              mountPath: /var/www/html/storage/upload
            - name: config
              mountPath: /var/www/html/storage/config
            - name: secrets
              mountPath: /var/www/html/secrets

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: sk
          persistentVolumeClaim:
            claimName: teampass-sk
        - name: files
          persistentVolumeClaim:
            claimName: teampass-files
        - name: upload
          persistentVolumeClaim:
            claimName: teampass-upload
        - name: config
          persistentVolumeClaim:
            claimName: teampass-config
        - name: secrets
          persistentVolumeClaim:
            claimName: teampass-secrets
---
# Service NodePort — acesso externo via porta do Raspberry Pi
apiVersion: v1
kind: Service
metadata:
  name: teampass
  namespace: teampass
  labels:
    app.kubernetes.io/name: teampass
    app.kubernetes.io/component: app
spec:
  type: NodePort
  selector:
    app: teampass
  ports:
    - port: 80
      targetPort: 80
      # NodePort fixo para acesso via http://<IP-DO-PI>:30090
      nodePort: 30090
      name: http