# ============================================
# TeamPass - Secrets
# ============================================
# IMPORTANTE: Substitua os valores base64 pelos seus.
# Gere com: echo -n "SuaSenha" | base64
#
# No Linux (no próprio Pi):
#   echo -n "Minhasenha@123" | base64
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: teampass-db-secret
  namespace: teampass
  labels:
    app.kubernetes.io/name: teampass
    app.kubernetes.io/component: database
type: Opaque
data:
  # echo -n "teampass" | base64
  db-name: dGVhbXBhc3M=
  # echo -n "teampass" | base64
  db-user: dGVhbXBhc3M=
  # echo -n "TroquePorSenhaSegura123!" | base64
  db-password: VHJvcXVlUG9yU2VuaGFTZWd1cmExMjMh
  # echo -n "TroquePorSenhaRootSegura456!" | base64
  db-root-password: VHJvcXVlUG9yU2VuaGFSb290U2VndXJhNDU2IQ==
---
apiVersion: v1
kind: Secret
metadata:
  name: teampass-app-secret
  namespace: teampass
  labels:
    app.kubernetes.io/name: teampass
    app.kubernetes.io/component: app
type: Opaque
data:
  # echo -n "TroquePorSenhaAdmin789!" | base64
  admin-password: VHJvcXVlUG9yU2VuaGFBZG1pbjc4OSE=